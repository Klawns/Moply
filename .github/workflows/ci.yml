name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Verify

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Validate formatting
        run: ./mvnw spring-javaformat:validate

      - name: Run Maven verification
        run: ./mvnw clean verify

      - name: Prepare runtime dependency scan
        run: |
          mkdir -p target/security-input
          cp target/moply-0.0.1-SNAPSHOT.jar target/security-input/application.jar

      - name: Scan packaged transitive dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: target/security-input
          grype-version: v0.120.1
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: json
          output-file: target/security-scan.json

      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-report
          path: target/security-scan.json
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore