spring.application.name=moply

spring.profiles.active=${ACTIVE_PROFILE:dev}

moply.auth.jwt.secret=${MOPLY_JWT_SECRET}
moply.auth.jwt.issuer=${MOPLY_JWT_ISSUER:moply}
moply.auth.jwt.audience=${MOPLY_JWT_AUDIENCE:moply-api}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true

# Provisional authentication protection: burst / seconds per replenished request.
moply.auth.rate-limit.login-ip-burst=${MOPLY_AUTH_LOGIN_IP_BURST:20}
moply.auth.rate-limit.login-ip-refill-seconds=${MOPLY_AUTH_LOGIN_IP_REFILL_SECONDS:3}
moply.auth.rate-limit.login-account-burst=${MOPLY_AUTH_LOGIN_ACCOUNT_BURST:5}
moply.auth.rate-limit.login-account-refill-seconds=${MOPLY_AUTH_LOGIN_ACCOUNT_REFILL_SECONDS:60}
moply.auth.rate-limit.signup-ip-burst=${MOPLY_AUTH_SIGNUP_IP_BURST:3}
moply.auth.rate-limit.signup-ip-refill-seconds=${MOPLY_AUTH_SIGNUP_IP_REFILL_SECONDS:1200}
moply.auth.rate-limit.max-entries=${MOPLY_AUTH_RATE_MAX_ENTRIES:10000}
moply.auth.rate-limit.trusted-proxies=${MOPLY_AUTH_TRUSTED_PROXIES:}
# Do not let untrusted forwarded headers change the rate limit identity.
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=16KB
